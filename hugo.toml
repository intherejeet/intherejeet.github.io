baseURL = 'https://intherejeet.github.io/'
languageCode = 'en-us'
title = 'Inderjeet Singh'
theme = 'PaperMod'

[pagination]
pagerSize = 10

[params]
description = "Inderjeet Singh is a Principal Researcher in AI Security at Fujitsu Research of Europe, working on physical AI security for robotic and space systems and on the security of language models, agents, and computer vision."
author = "Inderjeet Singh"
defaultTheme = "light" # dark, light, auto
disableThemeToggle = true
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = false
ShowBreadCrumbs = false
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = false
UseHugoToc = false
disableSpecial1stPost = true
disableScrollToTop = true
comments = false
hidemeta = true
hideSummary = true
showtoc = false
tocopen = false
enableSearch = false
enableRobotsTXT = true
enableGitInfo = false

# Custom CSS
[params.assets]
disableHLJS = true

# Social links
[[params.socialIcons]]
name = "googlescholar"
url = "https://scholar.google.com/citations?user=eoxiMqQAAAAJ&hl=en"

[[params.socialIcons]]
name = "github"
url = "https://github.com/intherejeet"

[[params.socialIcons]]
name = "linkedin"
url = "https://www.linkedin.com/in/intherejeet"



# Home page profile - Disabled for custom design
[params.profileMode]
enabled = false

# Research-first navigation
[[menu.main]]
identifier = "news"
name = "News"
url = "/#news"
weight = 10

[[menu.main]]
identifier = "research"
name = "Research"
url = "/#research"
weight = 20

[[menu.main]]
identifier = "publications"
name = "Publications"
url = "/publications/"
weight = 30

# Taxonomies
[taxonomies]
category = "categories"
tag = "tags"
series = "series"

# Markup settings
[markup]
  [markup.highlight]
    anchorLineNos = true
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Privacy settings
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    disable = false
    respectDoNotTrack = true
    useSessionStorage = false

# Outputs for search
[outputs]
home = ["HTML", "RSS"]

# Sitemap
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
